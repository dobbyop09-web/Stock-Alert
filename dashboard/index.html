<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Alert dashboard</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div class="wrap">
        <div class="topbar">
            <div>
                <h1>Stock Dashboard</h1>
                <p class="sub" id="subline">Loading...</p>

            </div>
            <span id="refreshMsg" style="font-size:20px;color:var(--triggered);margin-left:6px;"></span>
            <nav class="navbar">
                <a href="index.html" class="active">Dashboard</a>
                <a href="heatmap.html">Heat Map</a>
            </nav>
            <div class="ticker-scroll">
                <div class="ticker" id="indexTicker">
                    <!-- rendered by JS -->
                </div>
            </div>

        </div>

        <div class="layout">
            <aside class="sidebar">
                <div class="sidebar-search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="searchBox" placeholder="Search symbol or sector...">
                </div>

                <p class="sidebar-title">Sectors</p>
                <ul class="sector-list" id="sectorList"></ul>
            </aside>

            <main class="main">
                <div class="stats" id="stats"></div>

                <div class="toolbar">
                    <button id="refreshBtn">Refresh Now</button>
                    <button id="loginBtn" disabled>Loading Google Sign-In…</button>
                    <span id="authStatus"></span>
                    <button id="sortBtn">Sort by closest to alert</button>
                    <button id="sortMcBtn">Market Cap ↓</button>
                </div>

                <div class="showing" id="showingLine"></div>

                <div class="paste" id="pasteBox">
                    <textarea id="pasteArea"
                        placeholder="Paste rows copied from Google Sheets (Symbol, Current price, Alert price) — tab or comma separated, one row per line"></textarea>
                    <div class="row">
                        <button class="primary" id="importBtn">Import</button>
                    </div>
                    <p class="hint">Select your Symbol / Current Price / Alert Price columns in Sheets, copy, then
                        paste here.</p>
                </div>

                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:22%">Symbol</th>
                                <th class="num" style="width:18%">Current</th>
                                <th id="alertHeader" class="num" style="width:18%">Alert</th>
                                <th class="num" style="width:16%">Distance</th>
                                <th style="width:18%">Status</th>
                                <th style="width:8%">Sector</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div class="empty" id="emptyMsg" style="display:none;">No stocks yet. Add a row or paste from your
                    sheet.</div>
            </main>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
