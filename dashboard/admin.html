<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<title>Portfolio</title>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">

<style>
    /* ---- Page shell (mirrors layout.css .wrap/.topbar, without the
       dashboard's sidebar-driven fixed-viewport rules) ---- */

    .wrap {
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        padding: 20px clamp(12px, 4vw, 32px) 40px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
        flex-wrap: wrap;
    }

    @media (max-width: 560px) {
        .wrap {
            padding: 14px 12px 32px;
        }
    }

    /* ---- View toggle (Table / JSON), styled like .sector-item.active ---- */

    .view-toggle {
        display: inline-flex;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px;
    }

    .view-toggle button {
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        padding: 6px 12px;
        border-radius: 4px;
    }

    .view-toggle button:hover {
        background: transparent;
        border-color: transparent;
        color: var(--text);
    }

    .view-toggle button.active {
        background: #1B2A2E;
        border-color: #2DD4BF;
        color: #2DD4BF;
    }

    /* ---- Remove column, only shown while editing ---- */

    .remove-cell {
        display: none;
        width: 70px;
    }

    .remove-cell.visible {
        display: table-cell;
    }

    /* ---- Add-holding button ---- */

    .add-row-btn {
        width: 100%;
        background: transparent;
        border: 1px dashed var(--line);
        color: var(--muted);
        margin-top: 10px;
    }

    .add-row-btn:hover {
        color: var(--text);
        border-color: #2DD4BF;
    }

    /* ---- Status text ---- */

    .status-ok { color: var(--watch); }
    .status-err { color: var(--triggered); }

    /* ---- JSON editor ---- */

    #jsonEditor {
        min-height: 420px;
        font-size: 13px;
    }

    /* ---- Login modal ---- */

    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
        z-index: 100;
    }

    .modal-overlay.visible {
        display: flex;
    }

    .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        width: 100%;
        max-width: 320px;
    }

    .modal h2 {
        font-size: 15px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--text);
        margin: 0 0 4px;
    }

    .modal .hint {
        margin: 0 0 16px;
    }

    .modal label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .05em;
        margin: 12px 0 6px;
    }

    .modal input.text-control {
        width: 100%;
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
    }

    .modal-actions button {
        flex: 1;
    }
</style>
</head>

<body>
    <div class="wrap">
        <div class="topbar">
            <div>
                <h1>Portfolio</h1>
                <p class="sub" id="lastUpdated">Loading...</p>
            </div>

            <nav class="navbar">
                <a href="index.html">Dashboard</a>
                <a href="heatmap.html">Heat Map</a>
                <a href="portfolio.html" class="active">Portfolio</a>
            </nav>
        </div>

        <div class="toolbar" id="sortToolbar">
            <button id="signInBtn" style="display:none;">Sign in</button>
            <button id="editBtn" style="display:none;">Edit</button>
            <button id="cancelBtn" style="display:none;">Cancel</button>
            <button id="logoutBtn" style="display:none;">Sign out</button>
            <span class="hint" id="whoami" style="display:none;"></span>
            <button id="sortSymbolBtn" style="display:none;">Sort A–Z</button>
            <button id="sortProfitBtn" style="display:none;">Sort by Profit ↓</button>
        </div>

        <div class="toolbar" id="toolbar" style="display:none;">
            <div class="view-toggle">
                <button id="tableViewBtn" class="active">Table</button>
                <button id="jsonViewBtn">JSON</button>
            </div>
        </div>

        <div class="table-scroll" id="tableView">
            <table>
                <thead>
                    <tr>
                        <th style="width:15%">Symbol</th>
                        <th class="num" style="width:11%">Buy Price</th>
                        <th class="num" style="width:11%">Current Price</th>
                        <th class="num" style="width:9%">Chg %</th>
                        <th class="num" style="width:10%">Profit</th>
                        <th style="width:14%">Buy Date</th>
                        <th class="num" style="width:10%">Target</th>
                        <th class="num" style="width:10%">Target %</th>
                        <th class="remove-cell" id="removeHeaderCell"></th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="empty" id="emptyMsg" style="display:none;">No holdings yet.</div>

        <button class="add-row-btn" id="addRowBtn" style="display:none;">+ Add holding</button>

        <textarea id="jsonEditor" spellcheck="false" style="display:none;"></textarea>
        <p class="hint" id="jsonError" style="color:var(--triggered); display:none;"></p>

        <datalist id="symbolList"></datalist>

        <div class="toolbar" id="bottomBar" style="display:none; justify-content:space-between;">
            <span class="hint" id="saveStatus"></span>
            <button class="primary" id="saveBtn">Save to R2</button>
        </div>
    </div>

    <!-- Login modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <h2>Sign in to edit</h2>
            <p class="hint">Admin access required.</p>

            <label for="username">Username</label>
            <input type="text" id="username" class="text-control" autocomplete="username">

            <label for="password">Password</label>
            <input type="password" id="password" class="text-control" autocomplete="current-password">

            <p class="hint" id="loginError" style="color:var(--triggered);"></p>

            <div class="modal-actions">
                <button id="loginCancelBtn">Cancel</button>
                <button class="primary" id="loginSubmitBtn">Sign in</button>
            </div>
        </div>
    </div>

<script>
(() => {
  const API_BASE = "https://tiny-art-8473.dobbyop09.workers.dev";

  let sessionToken = null;
  let holdings = [];
  let holdingsSnapshot = [];
  let isEditing = false;
  let currentView = "table";
  let symbolDataMap = {}; // SYMBOL -> { currentPrice, changePercent, sector, screenerUrl }

  const sortSymbolBtn  = document.getElementById("sortSymbolBtn");
  const sortProfitBtn  = document.getElementById("sortProfitBtn");
  let sortField = null;   // "symbol" | "profit" | null
  let sortDir   = "asc";  // "asc" | "desc"

  const signInBtn       = document.getElementById("signInBtn");
  const editBtn        = document.getElementById("editBtn");
  const cancelBtn       = document.getElementById("cancelBtn");
  const logoutBtn       = document.getElementById("logoutBtn");
  const whoami          = document.getElementById("whoami");
  const toolbar         = document.getElementById("toolbar");
  const tbody            = document.getElementById("tbody");
  const emptyMsg         = document.getElementById("emptyMsg");
  const addRowBtn        = document.getElementById("addRowBtn");
  const removeHeaderCell = document.getElementById("removeHeaderCell");
  const bottomBar        = document.getElementById("bottomBar");
  const saveStatus       = document.getElementById("saveStatus");
  const jsonEditor        = document.getElementById("jsonEditor");
  const jsonErrorEl       = document.getElementById("jsonError");
  const tableView         = document.getElementById("tableView");
  const tableViewBtn      = document.getElementById("tableViewBtn");
  const jsonViewBtn       = document.getElementById("jsonViewBtn");
  const lastUpdatedEl     = document.getElementById("lastUpdated");

  const loginModal    = document.getElementById("loginModal");
  const loginError    = document.getElementById("loginError");
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");

  // ---------------- Token storage (survives page refresh) ----------------

  const TOKEN_KEY = "portfolioAdminToken";

  function saveToken(token) {
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) { /* ignore */ }
  }
  function readStoredToken() {
    try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }
  function clearStoredToken() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ }
  }
  function decodeTokenPayload(token) {
    try {
      const b64payload = token.split(".")[0];
      const json = atob(b64payload.replace(/-/g, "+").replace(/_/g, "/"));
      return JSON.parse(json);
    } catch (e) {
      return null;
    }
  }

  // ---------------- Auth UI state ----------------

  function updateAuthUI(loggedIn, username) {
    signInBtn.style.display     = loggedIn ? "none" : "inline-block";
    editBtn.style.display       = loggedIn ? "inline-block" : "none";
    logoutBtn.style.display     = loggedIn ? "inline-block" : "none";
    sortSymbolBtn.style.display = loggedIn ? "inline-block" : "none";
    sortProfitBtn.style.display = loggedIn ? "inline-block" : "none";
    if (loggedIn) {
      whoami.textContent = `Signed in as ${username}`;
      whoami.style.display = "inline";
    } else {
      whoami.style.display = "none";
    }
  }

  function showSignedOutPlaceholder() {
    tableView.style.display = "none";
    emptyMsg.style.display = "block";
    emptyMsg.textContent = "Sign in to view your portfolio.";
    addRowBtn.style.display = "none";
    bottomBar.style.display = "none";
    lastUpdatedEl.textContent = "";
  }

  function handleAuthExpired() {
    clearStoredToken();
    sessionToken = null;
    isEditing = false;
    toolbar.style.display = "none";
    cancelBtn.style.display = "none";
    removeHeaderCell.classList.remove("visible");
    addRowBtn.style.display = "none";
    bottomBar.style.display = "none";
    updateAuthUI(false);
    showSignedOutPlaceholder();
    openLoginModal();
  }

  // ---------------- Load (requires auth) ----------------

  async function loadPortfolio() {
    if (!sessionToken) {
      showSignedOutPlaceholder();
      return;
    }
    lastUpdatedEl.textContent = "Loading...";
    try {
      const res = await fetch(`${API_BASE}/portfolio.json`, {
        headers: { "Authorization": `Bearer ${sessionToken}` },
      });
      if (res.status === 401) {
        handleAuthExpired();
        return;
      }
      if (res.status === 404) {
        holdings = [];
        lastUpdatedEl.textContent = "No data yet";
      } else if (res.ok) {
        const data = await res.json();
        holdings = Array.isArray(data.holdings) ? data.holdings : [];
        lastUpdatedEl.textContent = data.lastUpdated
          ? "Last updated " + new Date(data.lastUpdated).toLocaleString()
          : "";
      } else {
        throw new Error("Failed to load");
      }
      holdingsSnapshot = JSON.parse(JSON.stringify(holdings));
      renderTable();
    } catch (err) {
      lastUpdatedEl.textContent = "Failed to load portfolio";
    }
  }

  // ---------------- Symbol search (from dashboard-data.json) ----------------

  async function loadSymbolList() {
    try {
      const res = await fetch(`${API_BASE}/dashboard-data`);
      if (!res.ok) return;
      const data = await res.json();
      const list = document.getElementById("symbolList");
      list.innerHTML = "";
      (Array.isArray(data) ? data : []).forEach((item) => {
        if (!item.symbol) return;
        symbolDataMap[item.symbol.toUpperCase()] = {
          currentPrice: item.currentPrice,
          changePercent: item.changePercent,
          sector: item.sheet,
          screenerUrl: item.screenerUrl,
        };
        const opt = document.createElement("option");
        opt.value = item.symbol;
        list.appendChild(opt);
      });
    } catch (err) {
      // Autocomplete just won't be available — not fatal.
    }
    if (currentView === "table") renderTable();
  }

  // ---------------- Edit gating / login ----------------

  function openLoginModal() {
    loginError.textContent = "";
    usernameInput.value = "";
    passwordInput.value = "";
    loginModal.classList.add("visible");
    usernameInput.focus();
  }

  function closeLoginModal() {
    loginModal.classList.remove("visible");
  }

  async function submitLogin() {
    loginError.textContent = "";
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      loginError.textContent = "Enter username and password.";
      return;
    }

    const btn = document.getElementById("loginSubmitBtn");
    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });

      if (!res.ok) {
        loginError.textContent = "Invalid username or password.";
        return;
      }

      const data = await res.json();
      sessionToken = data.token;
      saveToken(data.token);
      const uname = data.username || username;
      updateAuthUI(true, uname);

      closeLoginModal();
      await loadPortfolio();
    } catch (err) {
      loginError.textContent = "Could not reach the server. Try again.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  }

  function enterEditMode() {
    if (!sessionToken) {
      openLoginModal();
      return;
    }
    isEditing = true;
    holdingsSnapshot = JSON.parse(JSON.stringify(holdings));

    editBtn.style.display = "none";
    cancelBtn.style.display = "inline-block";
    toolbar.style.display = "flex";
    addRowBtn.style.display = "block";
    removeHeaderCell.classList.add("visible");
    bottomBar.style.display = "flex";

    renderTable();
  }

  function exitEditMode(discard) {
    isEditing = false;
    if (discard) {
      holdings = JSON.parse(JSON.stringify(holdingsSnapshot));
    }

    editBtn.style.display = sessionToken ? "inline-block" : "none";
    cancelBtn.style.display = "none";
    toolbar.style.display = "none";
    addRowBtn.style.display = "none";
    removeHeaderCell.classList.remove("visible");
    bottomBar.style.display = "none";
    saveStatus.textContent = "";
    saveStatus.className = "hint";

    switchView("table", true);
    renderTable();
  }

  function cancelEdit() {
    const dirty = JSON.stringify(holdings) !== JSON.stringify(holdingsSnapshot);
    if (dirty && !confirm("Discard unsaved changes?")) return;
    exitEditMode(true);
  }

  function logout() {
    if (isEditing) {
      const dirty = JSON.stringify(holdings) !== JSON.stringify(holdingsSnapshot);
      if (dirty && !confirm("Discard unsaved changes and sign out?")) return;
    }
    clearStoredToken();
    sessionToken = null;
    isEditing = false;
    toolbar.style.display = "none";
    cancelBtn.style.display = "none";
    removeHeaderCell.classList.remove("visible");
    addRowBtn.style.display = "none";
    bottomBar.style.display = "none";
    holdings = [];
    updateAuthUI(false);
    showSignedOutPlaceholder();
  }

  // ---------------- Save ----------------

  async function savePortfolio() {
    if (currentView === "json") {
      if (!syncFromJson()) return;
    }

    saveStatus.textContent = "Saving...";
    saveStatus.className = "hint";

    const payload = {
      holdings,
      lastUpdated: new Date().toISOString(),
    };

    try {
      const res = await fetch(`${API_BASE}/portfolio.json`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${sessionToken}`,
        },
        body: JSON.stringify(payload),
      });

      if (res.status === 401) {
        saveStatus.textContent = "Session expired — sign in again.";
        saveStatus.className = "hint status-err";
        handleAuthExpired();
        return;
      }

      if (!res.ok) throw new Error("Save failed");

      holdingsSnapshot = JSON.parse(JSON.stringify(holdings));
      saveStatus.textContent = "Saved — " + new Date().toLocaleTimeString();
      saveStatus.className = "hint status-ok";
      lastUpdatedEl.textContent = "Last updated " + new Date(payload.lastUpdated).toLocaleString();
      renderJson();
    } catch (err) {
      saveStatus.textContent = "Save failed. Try again.";
      saveStatus.className = "hint status-err";
    }
  }

  // ---------------- Sorting ----------------

  function profitPct(buyPrice, currentPrice) {
    const b = parseFloat(buyPrice);
    const c = parseFloat(currentPrice);
    if (!isFinite(b) || b === 0 || !isFinite(c)) return -Infinity;
    return ((c - b) / b) * 100;
  }

  function applySort() {
    if (!sortField) return;
    holdings.sort((a, b) => {
      if (sortField === "symbol") {
        const va = (a.symbol || "").toUpperCase();
        const vb = (b.symbol || "").toUpperCase();
        if (va < vb) return sortDir === "asc" ? -1 : 1;
        if (va > vb) return sortDir === "asc" ? 1 : -1;
        return 0;
      }
      // profit
      const pa = profitPct(a.buyPrice, a.currentPrice);
      const pb = profitPct(b.buyPrice, b.currentPrice);
      return sortDir === "asc" ? pa - pb : pb - pa;
    });
  }

  function updateSortButtons() {
    sortSymbolBtn.textContent = sortField === "symbol"
      ? `Sort ${sortDir === "asc" ? "A–Z" : "Z–A"}`
      : "Sort A–Z";
    sortProfitBtn.textContent = sortField === "profit"
      ? `Sort by Profit ${sortDir === "desc" ? "↓" : "↑"}`
      : "Sort by Profit ↓";
  }

  function sortHoldings(field) {
    if (sortField === field) {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortField = field;
      sortDir = field === "profit" ? "desc" : "asc";
    }
    applySort();
    updateSortButtons();
    if (currentView === "json") {
      renderJson();
    } else {
      renderTable();
    }
  }

  sortSymbolBtn.addEventListener("click", () => sortHoldings("symbol"));
  sortProfitBtn.addEventListener("click", () => sortHoldings("profit"));

  // ---------------- Table rendering ----------------

  function profitInfo(buyPrice, currentPrice) {
    const b = parseFloat(buyPrice);
    const c = parseFloat(currentPrice);
    if (!isFinite(b) || b === 0 || !isFinite(c)) {
      return { text: "—", cls: "b-far" };
    }
    const pct = ((c - b) / b) * 100;
    const cls = pct > 0 ? "b-watch" : pct < 0 ? "b-triggered" : "b-far";
    const sign = pct > 0 ? "+" : "";
    return { text: `${sign}${pct.toFixed(2)}%`, cls };
  }

  function fmtMoney(v) {
    const n = parseFloat(v);
    return isFinite(n) ? n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—";
  }

  function fmtDate(v) {
    if (!v) return "—";
    const d = new Date(v);
    return isNaN(d) ? v : d.toLocaleDateString();
  }

  function changeBadge(pct) {
    const n = parseFloat(pct);
    if (!isFinite(n)) return `<span class="badge b-far">—</span>`;
    const cls = n > 0 ? "b-watch" : n < 0 ? "b-triggered" : "b-far";
    const sign = n > 0 ? "+" : "";
    return `<span class="badge ${cls}">${sign}${n.toFixed(2)}%</span>`;
  }

  function renderTable() {
    tbody.innerHTML = "";

    if (holdings.length === 0) {
      tableView.style.display = "none";
      emptyMsg.style.display = "block";
      emptyMsg.textContent = isEditing ? "No holdings yet. Add one below." : "No holdings yet.";
      return;
    }

    tableView.style.display = "block";
    emptyMsg.style.display = "none";

    holdings.forEach((h, i) => {
      const tr = document.createElement("tr");
      const profit = profitInfo(h.buyPrice, h.currentPrice);
      const profitBadge = `<span class="badge ${profit.cls}">${profit.text}</span>`;
      const targetPct = profitInfo(h.buyPrice, h.targetAmount);
      const targetPctBadge = `<span class="badge ${targetPct.cls}">${targetPct.text}</span>`;
      const symbolData = symbolDataMap[(h.symbol || "").toUpperCase()];
      const chgBadge = changeBadge(symbolData ? symbolData.changePercent : undefined);

      if (isEditing) {
        tr.innerHTML = `
          <td><input type="text" class="cell" list="symbolList" value="${escapeAttr(h.symbol ?? "")}" data-i="${i}" data-f="symbol" placeholder="AAPL"></td>
          <td><input type="number" step="any" class="cell num" value="${numOrBlank(h.buyPrice)}" data-i="${i}" data-f="buyPrice" placeholder="0.00"></td>
          <td class="num current-price-cell">${fmtMoney(h.currentPrice)}</td>
          <td class="num chg-cell">${chgBadge}</td>
          <td class="num profit-cell">${profitBadge}</td>
          <td><input type="date" class="cell" value="${escapeAttr(h.buyDate ?? "")}" data-i="${i}" data-f="buyDate"></td>
          <td><input type="number" step="any" class="cell num" value="${numOrBlank(h.targetAmount)}" data-i="${i}" data-f="targetAmount" placeholder="0.00"></td>
          <td class="num target-pct-cell">${targetPctBadge}</td>
          <td class="remove-cell visible"><button class="danger" data-remove="${i}">Remove</button></td>
        `;
      } else {
        tr.innerHTML = `
          <td><a class="stock-link">${escapeHtml(h.symbol || "—")}</a></td>
          <td class="num">${fmtMoney(h.buyPrice)}</td>
          <td class="num">${fmtMoney(h.currentPrice)}</td>
          <td class="num chg-cell">${chgBadge}</td>
          <td class="num profit-cell">${profitBadge}</td>
          <td>${fmtDate(h.buyDate)}</td>
          <td class="num">${fmtMoney(h.targetAmount)}</td>
          <td class="num target-pct-cell">${targetPctBadge}</td>
        `;
      }
      tbody.appendChild(tr);
    });
  }

  function numOrBlank(v) {
    return (v === undefined || v === null || v === "") ? "" : v;
  }
  function escapeAttr(str) {
    return String(str).replace(/"/g, "&quot;");
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  tbody.addEventListener("input", (e) => {
    if (!isEditing) return;
    const target = e.target;
    const i = target.getAttribute("data-i");
    const f = target.getAttribute("data-f");
    if (i === null || !f) return;

    const idx = parseInt(i, 10);
    let val = target.value;

    if (f === "buyPrice" || f === "targetAmount") {
      holdings[idx][f] = val === "" ? "" : parseFloat(val);
    } else {
      holdings[idx][f] = val;
    }

    const row = target.closest("tr");

    if (f === "symbol") {
      const match = symbolDataMap[val.trim().toUpperCase()];
      if (match !== undefined) {
        holdings[idx].currentPrice = match.currentPrice;
        const priceCell = row.querySelector(".current-price-cell");
        if (priceCell) priceCell.textContent = fmtMoney(match.currentPrice);
        const chgCell = row.querySelector(".chg-cell");
        if (chgCell) chgCell.innerHTML = changeBadge(match.changePercent);
      }
    }

    if (f === "buyPrice" || f === "symbol") {
      const profit = profitInfo(holdings[idx].buyPrice, holdings[idx].currentPrice);
      const cell = row.querySelector(".profit-cell");
      cell.innerHTML = `<span class="badge ${profit.cls}">${profit.text}</span>`;
    }

    if (f === "buyPrice" || f === "targetAmount") {
      const targetCell = row.querySelector(".target-pct-cell");
      if (targetCell) {
        const targetPct = profitInfo(holdings[idx].buyPrice, holdings[idx].targetAmount);
        targetCell.innerHTML = `<span class="badge ${targetPct.cls}">${targetPct.text}</span>`;
      }
    }
  });

  tbody.addEventListener("click", (e) => {
    if (!isEditing) return;
    const removeIdx = e.target.getAttribute("data-remove");
    if (removeIdx !== null) {
      holdings.splice(parseInt(removeIdx, 10), 1);
      renderTable();
    }
  });

  addRowBtn.addEventListener("click", () => {
    holdings.push({ symbol: "", buyPrice: "", currentPrice: "", buyDate: "", targetAmount: "" });
    renderTable();
    const inputs = tbody.querySelectorAll('input[data-f="symbol"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
  });

  // ---------------- JSON view ----------------

  function renderJson() {
    jsonEditor.value = JSON.stringify({ holdings }, null, 2);
    jsonErrorEl.style.display = "none";
  }

  function syncFromJson() {
    try {
      const parsed = JSON.parse(jsonEditor.value);
      if (!Array.isArray(parsed.holdings)) {
        throw new Error('JSON must have a "holdings" array');
      }
      holdings = parsed.holdings;
      jsonErrorEl.style.display = "none";
      return true;
    } catch (err) {
      jsonErrorEl.textContent = "Invalid JSON: " + err.message;
      jsonErrorEl.style.display = "block";
      return false;
    }
  }

  function switchView(view, force) {
    if (view === currentView && !force) return;

    if (!force) {
      if (currentView === "table" && view === "json") {
        renderJson();
      } else if (currentView === "json" && view === "table") {
        if (!syncFromJson()) return;
        renderTable();
      }
    }

    currentView = view;
    const showTable = view === "table";
    tableView.style.display = showTable ? (holdings.length ? "block" : "none") : "none";
    emptyMsg.style.display = (showTable && holdings.length === 0) ? "block" : "none";
    addRowBtn.style.display = (showTable && isEditing) ? "block" : "none";
    jsonEditor.style.display = showTable ? "none" : "block";
    jsonErrorEl.style.display = (!showTable && jsonErrorEl.textContent) ? "block" : "none";
    tableViewBtn.classList.toggle("active", showTable);
    jsonViewBtn.classList.toggle("active", !showTable);
  }

  tableViewBtn.addEventListener("click", () => switchView("table"));
  jsonViewBtn.addEventListener("click", () => switchView("json"));

  // ---------------- Wire up ----------------

  signInBtn.addEventListener("click", openLoginModal);
  editBtn.addEventListener("click", enterEditMode);
  cancelBtn.addEventListener("click", cancelEdit);
  logoutBtn.addEventListener("click", logout);
  document.getElementById("saveBtn").addEventListener("click", savePortfolio);

  document.getElementById("loginCancelBtn").addEventListener("click", closeLoginModal);
  document.getElementById("loginSubmitBtn").addEventListener("click", submitLogin);
  passwordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitLogin();
  });
  loginModal.addEventListener("click", (e) => {
    if (e.target === loginModal) closeLoginModal();
  });

  // ---------------- Startup: restore session or prompt login ----------------

  function init() {
    const token = readStoredToken();
    const payload = token ? decodeTokenPayload(token) : null;
    const stillValid = payload && payload.exp > Math.floor(Date.now() / 1000);

    if (stillValid) {
      sessionToken = token;
      updateAuthUI(true, payload.u);
      loadPortfolio();
    } else {
      if (token) clearStoredToken();
      updateAuthUI(false);
      showSignedOutPlaceholder();
      openLoginModal();
    }
    loadSymbolList();
  }

  init();
})();
</script>

</body>
