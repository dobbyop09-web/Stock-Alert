<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Market Heatmap</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/heatmap.css">
</head>

<body>
    <div class="shell">

        <!-- ══ Icon sidebar — same as Dashboard / Portfolio ══ -->
        <aside class="sb">
            <nav class="sb-nav">
                <a href="index.html" class="sb-link" data-title="Dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                </a>
                 <a href="watchlist.html" class="sb-link active" data-title="Market Watchlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3v18h18"/><path d="M7 12l4-4 3 3 4-6"/>
      </svg>
    </a>
                <a href="heatmap.html" class="sb-link active" data-title="Heat Map">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 2v20M2 12h20" />
                    </svg>
                </a>
                <a href="admin.html" class="sb-link" data-title="Portfolio">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h18v18H3z" />
                        <path d="M3 9h18M9 21V9" />
                    </svg>
                </a>
            </nav>
        </aside>

        <!-- ══ Main app column ══ -->
        <div class="app-main">

            <header class="topbar">
                <div class="topbar-title">
                    <h1>Market Heatmap</h1>
                    <p class="sub" id="updated">Loading...</p>
                </div>
            </header>

            <div class="content" id="content">
                <div class="page-body">

                    <aside class="sidebar">
                        <div class="sidebar-search">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input type="text" id="search" placeholder="Search symbol or sector...">
                        </div>

                        <p class="sidebar-title">Sectors</p>
                        <ul class="sector-list" id="sectorList"></ul>
                    </aside>

                    <main class="content-main">
                        <div class="table-toolbar-wrap">
                            <select id="sortBy" class="select-control">
                                <option value="marketCap">Sort: Market Cap</option>
                                <option value="changeDesc">Sort: Change % (High to Low)</option>
                                <option value="changeAsc">Sort: Change % (Low to High)</option>
                                <option value="symbol">Sort: Symbol (A-Z)</option>
                            </select>

                            <div class="legend" id="legend"></div>
                        </div>

                        <div class="heatmap-scroll">
                            <div id="heatmap" class="heatmap"></div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module" src="js/heatmap/main.js"></script>
</body>

</html>
