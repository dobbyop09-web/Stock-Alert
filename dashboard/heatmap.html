<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Market Heatmap</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/heatmap.css">
</head>

<body>
<div class="wrap">
    <div class="topbar">
        <div>
            <h1>Market Heatmap</h1>
            <p class="sub" id="updated">Loading...</p>
        </div>
        <nav class="navbar">
            <a href="index.html">Dashboard</a>
            <a href="heatmap.html" class="active">Heat Map</a>
        </nav>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="search" placeholder="Search symbol or sector...">
            </div>

            <p class="sidebar-title">Sectors</p>
            <ul class="sector-list" id="sectorList"></ul>
        </aside>

        <main class="main">
            <div class="toolbar">
                <select id="sortBy" class="select-control">
                    <option value="marketCap">Sort: Market Cap</option>
                    <option value="changeDesc">Sort: Change % (High to Low)</option>
                    <option value="changeAsc">Sort: Change % (Low to High)</option>
                    <option value="symbol">Sort: Symbol (A-Z)</option>
                </select>

                <div class="legend" id="legend"></div>
            </div>

            <div class="heatmap-scroll">
                <div id="heatmap" class="heatmap"></div>
            </div>
        </main>
    </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script type="module" src="js/heatmap/main.js"></script>
</body>

</html>
