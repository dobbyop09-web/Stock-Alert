<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Market Heatmap</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/heatmap.css">
</head>

<body>
    <div class="shell">

        <!-- ══ Icon sidebar — same as Dashboard / Portfolio ══ -->
     <aside class="sb" id="sidebar">
      <nav class="sb-nav">
        <a href="index.html" class="sb-link" data-title="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
    
            <path d="M18 10a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8" />
            <path d="M10 21h4" />
            <circle cx="18.5" cy="5.5" r="2.2" fill="currentColor" stroke="none" />
          </svg>
        </a>
        <a href="watchlist.html" class="sb-link" data-title="Market Watchlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
    
            <!-- Eye -->
            <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z" />
            <circle cx="12" cy="12" r="2.5" />
    
            <!-- Trend -->
            <path d="M14.5 19.5l3-3 2 1.5 3-4" />
          </svg>
        </a>
        <a href="heatmap.html" class="sb-link active" data-title="Heat Map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
    
            <rect x="3" y="3" width="5" height="5" />
            <rect x="10" y="3" width="5" height="5" />
            <rect x="17" y="3" width="4" height="5" />
    
            <rect x="3" y="10" width="5" height="5" />
            <rect x="10" y="10" width="5" height="5" />
            <rect x="17" y="10" width="4" height="5" />
    
            <rect x="3" y="17" width="5" height="4" />
            <rect x="10" y="17" width="5" height="4" />
            <rect x="17" y="17" width="4" height="4" />
          </svg>
        </a>
        <a href="admin.html" class="sb-link" data-title="Holdings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
    
            <path d="M12 3a9 9 0 1 0 9 9h-9V3Z" />
            <path d="M15 3.5A9 9 0 0 1 20.5 9H15V3.5Z" />
          </svg>
        </a>
    
        <a href="realized-profit.html" class="sb-link" data-title="Realised P&L">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
    
            <!-- Trend -->
            <polyline points="3,17 8,12 12,15 20,7" />
    
            <!-- Arrow -->
            <polyline points="15,7 20,7 20,12" />
    
            <!-- Rupee -->
            <path d="M5 6h4.5" />
            <path d="M5 9h4.5" />
            <path d="M7 6c2.5 0 3.5 1.2 3.5 2.5S9.5 11 7 11" />
            <path d="M7 11l3.5 4" />
          </svg>
        </a>
        <a href="gtt-orders.html" class="sb-link" data-title="GTT Orders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
    
            <!-- Clock -->
            <circle cx="12" cy="12" r="8.5" />
    
            <!-- Hands -->
            <path d="M12 7v5l3.5 2" />
    
            <!-- Trigger dots -->
            <circle cx="12" cy="3" r="0.8" fill="currentColor" stroke="none" />
            <circle cx="20.5" cy="12" r="0.8" fill="currentColor" stroke="none" />
          </svg>
        </a>
        <a href="all-transactions.html" class="sb-link" data-title="All Trades">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
    
            <!-- Document -->
            <path d="M5 3h10l4 4v14H5V3Z" />
            <path d="M15 3v5h4" />
    
            <!-- Document lines -->
            <path d="M8 11h6" />
            <path d="M8 14h4" />
    
            <!-- Mini chart -->
            <path d="M8 18v-2" />
            <path d="M12 18v-4" />
            <path d="M16 18v-6" />
          </svg>
        </a>
      </nav>
    </aside>

        <!-- ══ Main app column ══ -->
        <div class="app-main">

            <header class="topbar">
                <div class="topbar-title">
                    <h1>Market Heatmap</h1>
                    <p class="sub" id="updated">Loading...</p>
                </div>
            </header>

            <div class="content" id="content">
                <div class="page-body">

                    <aside class="sidebar">
                        <div class="sidebar-search">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                            </svg>
                            <input type="text" id="search" placeholder="Search symbol or sector...">
                        </div>

                        <p class="sidebar-title">Sectors</p>
                        <ul class="sector-list" id="sectorList"></ul>
                    </aside>

                    <main class="content-main">
                        <div class="table-toolbar-wrap">
                            <select id="sortBy" class="select-control">
                                <option value="marketCap">Sort: Market Cap</option>
                                <option value="changeDesc">Sort: Change % (High to Low)</option>
                                <option value="changeAsc">Sort: Change % (Low to High)</option>
                                <option value="symbol">Sort: Symbol (A-Z)</option>
                            </select>

                            <div class="legend" id="legend"></div>
                        </div>

                        <div class="heatmap-scroll">
                            <div id="heatmap" class="heatmap"></div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script type="module" src="js/heatmap/main.js"></script>
</body>

</html>
