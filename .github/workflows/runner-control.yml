name: Runner Control

on:
  workflow_dispatch:
    inputs:
      runners:
        description: 'Comma-separated runner IDs (fii-data,index-options,oi-data,index-data)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  runner-control:
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_IDS: ${{ secrets.CHAT_IDS }}
      ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
      CONSUMER_ID: ${{ secrets.CONSUMER_ID }}
      MOBILE: ${{ secrets.MOBILE }}
      MPIN: ${{ secrets.MPIN }}
      TOTP_SECRET: ${{ secrets.TOTP_SECRET }}

      RUNNER_SELECTION: ${{ inputs.runners }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Runner Selection
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RUNNER_SELECTION//[[:space:]]/}" ]]; then
            echo "No runners were selected."
            exit 1
          fi

          IFS=',' read -ra SELECTED_RUNNERS <<< "$RUNNER_SELECTION"

          for runner in "${SELECTED_RUNNERS[@]}"; do
            runner="$(echo "$runner" | xargs)"

            case "$runner" in
              fii-data|index-options|oi-data|index-data)
                echo "Selected runner: $runner"
                ;;
              *)
                echo "Invalid runner ID: '$runner'"
                echo "Allowed IDs: fii-data,index-options,oi-data,index-data"
                exit 1
                ;;
            esac
          done

      - name: Build
        run: mvn clean package -DskipTests

      - name: Run Selected Runners
        run: |
          java -jar target/*.jar \
            --app.runner-selection="${RUNNER_SELECTION}"
